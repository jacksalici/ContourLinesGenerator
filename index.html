<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curve Generator</title>
<style>
body {
    margin: 0;
    display: flex;
    align-items: flex-start;
    font-size: 13px;
}

#sidebar {
    box-sizing: border-box;
    width: 280px;
    flex: none;
    height: 100vh;
    overflow-y: auto;
    padding: 10px;
    border-right: 1px solid #999;
}

#main {
    flex: 1;
    min-width: 0;
    padding: 10px;
}

h1 {
    font-size: 15px;
    margin: 0;
}

h2 {
    font-size: 12px;
    margin: 14px 0 4px;
    border-bottom: 1px solid #ccc;
}

label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 3px 0;
}

/* Needed because display:flex above would otherwise beat the hidden attribute. */
[hidden] {
    display: none;
}

label > span {
    flex: 1;
}

label > input,
label > select {
    width: 110px;
}

label > input[type="checkbox"] {
    width: auto;
    margin-right: auto;
}

label > output {
    width: 36px;
    text-align: right;
}

svg {
    border: 1px solid #999;
    max-width: 100%;
    height: auto;
    touch-action: none;
    cursor: crosshair;
}

/* Stack the sidebar above the canvas on narrow screens. */
@media (max-width: 700px) {
    body {
        display: block;
    }

    #sidebar {
        width: auto;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #999;
    }
}
</style>
</head>
<body>

<div id="sidebar">
    <h1>Curve Generator</h1>
    <p>Parametric contour lines &rarr; SVG</p>

    <p>
        <button data-action="random-points">Randomise</button>
        <button data-action="add-point">Add point</button>
        <button data-action="clear-points">Clear</button>
        <button data-action="reset">Reset</button>
    </p>

    <p>
        Zoom:
        <button data-action="zoom-in">+</button>
        <button data-action="zoom-out">&minus;</button>
        <button data-action="zoom-reset">Fit</button>
    </p>

    <div id="panel"></div>

    <h2>Export</h2>
    <p>
        <button data-action="export-svg">Export SVG</button>
        <button data-action="export-json">Save preset</button>
        <button data-action="import-json">Load preset</button>
        <input type="file" id="file-input" accept="application/json" hidden>
    </p>

    <h2>Editing</h2>
    <p>
        Click empty canvas to add a point. Click a point to select it, drag to move it.<br>
        Shift+drag or scroll over a point changes its height. Alt+click or right click deletes it.<br>
        Scroll to zoom, drag empty canvas to pan.
    </p>
</div>

<div id="main">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    <p id="stats"></p>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
